[package]
name = "rustlpr"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "RTSP multi-camera license plate recognition with ONNX Runtime and TCP event delivery"

[features]
default = []
cuda = ["ort/cuda"]

[dependencies]
anyhow = "1.0"
dotenvy = "0.15"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "ndarray", "tracing", "api-23"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
